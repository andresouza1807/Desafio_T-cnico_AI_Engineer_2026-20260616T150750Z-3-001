[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emporio-agent"
version = "0.1.0"
description = "Grounded customer-service assistant for Emporio da Musica"
requires-python = ">=3.14,<3.15"
dependencies = ["openai", "pydantic>=2,<3", "pypdf"]

[project.scripts]
emporio-agent = "emporio_agent.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/emporio_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
